name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install test dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Run backend tests
        run: |
          cd backend
          npm test

  repo-checks:
    name: Repo Checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install check dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Check formatting and lint
        run: npm run check

      - name: Run frontend unit and lab configuration tests
        run: |
          npm --prefix frontend run test:unit
          node --test scripts/lab-frontend-ports.test.mjs

      - name: Build documentation
        run: npm run docs:build

  e2e-tests:
    name: E2E (single user)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies and generate Prisma client
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix e2e ci
          cd backend && npx prisma generate

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Typecheck browser tests
        run: npm --prefix e2e run check

      - name: Run real browser and API journeys
        run: npm --prefix e2e test

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
