schema: spec-driven

context: |
  Language: en
  Use English for current documentation, code, UI and new artifacts.
  Historical change archives retain their original text.
  Keep OpenSpec structural headings and SHALL/MUST keywords.
  This is the independent Czy014/ExcaliDash fork of ZimengXiong/ExcaliDash.
  Run OpenSpec from this repository; do not use the parent workspace or Homebase root.
  The initial baseline is upstream 0f9be2d8649be7650e6bee2844739c584fa76c35, VERSION 0.6.7.
  The application is a single-user drawing library without real-time collaboration or authentication.
  Changes go through a change proposal and are synchronized to main specs only after validation.
  frontend/ uses React 18, TypeScript, Vite, React Router and the official @excalidraw/excalidraw.
  backend/ uses TypeScript, Express 5 and Prisma. Keeper uses SQLite; PostgreSQL is also supported.
  Unit and integration tests use Vitest; browser tests use Playwright in e2e/.
  Use Node.js >=24.22.1, npm 10.9.2 and existing package-lock.json files.
  Preserve drawings, collections, images, assets, import/export, history and AUTH_MODE=disabled.
  Homebase is a separate deployment manager. Production assembly belongs in its Draw plugin.
  Multiple pages may open a drawing. Version checks prevent overwrites; conflicts pause saves,
  retain local drafts and offer loading the latest scene or saving a complete copy.
  Develop on separate branches; main is for explicitly authorized integration.
  Preserve upstream copyright and the LGPLv3 license.

rules:
  proposal:
    - Describe the actual problem, preserved capabilities and exclusions. Include only changes owned by this repository.
  design:
    - Cite inspected source paths and distinguish current behavior from the proposed implementation.
    - For save changes, cover version races, queued requests, navigation, drafts, images and failure recovery. Reuse existing structures.
    - Do not test against production data or hide migrations, deployment or API changes in unrelated tasks.
  specs:
    - Use SHALL or MUST in each requirement and provide at least one verifiable WHEN/THEN scenario.
    - Main specs describe implemented behavior. Planned behavior belongs in change deltas until validation and synchronization.
  tasks:
    - List checkable tasks in dependency order using commands that exist in this repository.
    - Leave incomplete tasks unchecked. Separate specification validation, tests, builds and production validation in the Validation record.
